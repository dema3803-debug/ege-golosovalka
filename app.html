<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBEFF3">
<title>Мой план ЕГЭ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Layout: телефон — одна колонка и нижнее меню; компьютер — план слева, помощник справа */
:root{
  --bg:#FBEFF3; --surface:#FFFFFF; --raised:#FDF5F8; --line:#F1DDE5; --line2:#E6C9D4; --ink:#1B1620; --muted:#6B5A63; --faint:#9C8A93;
  --accent:#B8325E; --accent-ink:#FFFFFF; --accent-soft:#FBE3EB; --accent-line:#EBB3C6;
  --primary:#1B1620; --primary-ink:#FFFFFF; --pink:#E2557A;
  --ok:#14825f; --ok-soft:#E3F4EC; --warn:#B35418; --warn-soft:#FDF0E6;
  --s1:#3A6EE8; --s2:#14825f; --s3:#C06A1B; --s4:#8A44C2; --s5:#C3326F; --s0:#7A6A73;
  --display:"Nunito",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17121A; --surface:#221A25; --raised:#2B2230; --line:#3A2E40; --line2:#4A3B52; --ink:#F5EEF2; --muted:#BBA9B4; --faint:#86747F;
  --accent:#F28AAB; --accent-ink:#17121A; --accent-soft:#3D2232; --accent-line:#6E3653;
  --primary:#F5EEF2; --primary-ink:#17121A; --pink:#F28AAB;
  --ok:#47C99C; --ok-soft:#173329; --warn:#F0965D; --warn-soft:#38251A;
  --s1:#7B97FF; --s2:#47C99C; --s3:#E8A05C; --s4:#C38BE6; --s5:#EF7FAB; --s0:#A898A2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17121A; --surface:#221A25; --raised:#2B2230; --line:#3A2E40; --line2:#4A3B52; --ink:#F5EEF2; --muted:#BBA9B4; --faint:#86747F;
  --accent:#F28AAB; --accent-ink:#17121A; --accent-soft:#3D2232; --accent-line:#6E3653;
  --primary:#F5EEF2; --primary-ink:#17121A; --pink:#F28AAB;
  --ok:#47C99C; --ok-soft:#173329; --warn:#F0965D; --warn-soft:#38251A;
  --s1:#7B97FF; --s2:#47C99C; --s3:#E8A05C; --s4:#C38BE6; --s5:#EF7FAB; --s0:#A898A2; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* каркас */
.shell{display:grid;grid-template-columns:minmax(0,1fr);min-height:100%}
.main{padding-block:calc(18px + env(safe-area-inset-top,0px)) 170px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));width:100%;max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
#view{display:flex;flex-direction:column;gap:14px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.date{font-size:13px;color:var(--muted);font-weight:500}
h1{font-family:var(--display);font-weight:800;font-size:27px;line-height:1.15;margin:2px 0 0;letter-spacing:-.01em}
h2{font-size:17px;font-weight:800;margin:0}
h3{font-size:14px;font-weight:600;margin:0}
.toptabs{display:none}
.card{background:var(--surface);border:0;border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.status{font-size:13px;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--ink)}

/* кнопки */
.btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line2);background:var(--surface);border-radius:999px;padding:9px 15px;font-size:14px;font-weight:700;line-height:1.2}
.btn:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.soft{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.btn.danger{color:var(--warn);border-color:var(--line2)}
.btn.sm{padding:6px 11px;font-size:13px}
.iconbtn{border:0;background:transparent;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{background:var(--raised);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Козя и главная */
.hero{background:#F6DCE5;color:#1B1620;border-radius:28px;padding:16px;display:flex;flex-direction:column;gap:10px}
.herohead{display:flex;justify-content:space-between;align-items:center}
.herohead b{font-size:17px;font-weight:800}
.mood{font-size:13px;font-weight:700;color:#5A2A3D;background:#FFFFFF;border-radius:999px;padding:4px 10px}
.bubble{align-self:center;background:#FFFFFF;border-radius:18px;padding:10px 14px;font-size:15px;font-weight:700;text-align:center;max-width:290px;line-height:1.35}
.mascot{display:flex;justify-content:center}
.mascot svg{width:170px;height:auto;max-width:100%}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:#FFFFFF;border-radius:18px;padding:10px 14px;min-width:0}
.stat span{display:block;font-size:13px;color:#6B5A63;font-weight:700}
.stat b{font-size:21px;font-weight:800}
.streak{display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:8px 12px;font-weight:800;font-size:15px;white-space:nowrap}
.startbtn{border:0;background:var(--primary);color:var(--primary-ink);border-radius:22px;padding:14px 16px 14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;width:100%}
.startbtn .t1{display:block;font-size:18px;font-weight:800;line-height:1.25}
.startbtn .t2{display:block;font-size:14px;font-weight:600;opacity:.8}
.startbtn .play{width:46px;height:46px;flex:none;border-radius:50%;background:var(--pink);display:grid;place-items:center}
.minibar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--primary);color:var(--primary-ink);border-radius:18px;padding:10px 12px 10px 16px;font-weight:700}
.minibar .btn{color:var(--ink)}
.minibar .tm{font-variant-numeric:tabular-nums;font-size:18px;font-weight:800}
.b .play{grid-column:3;grid-row:1/3;width:36px;height:36px;border-radius:50%;border:0;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.b .play svg{width:14px;height:14px;fill:currentColor}
/* сессия */
.session{display:flex;flex-direction:column;gap:16px;align-items:stretch;min-height:calc(100vh - 60px)}
.shead{display:flex;align-items:center;justify-content:space-between}
.circbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center}
.sbtns{margin-top:auto}
.session .ring{position:relative;width:min(260px,72vw);aspect-ratio:1;margin:0 auto;max-width:100%}
.session .ring svg{position:absolute;inset:0;width:100%;height:100%}
.session .big{font-size:56px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1;text-align:center}
.durs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.durs button{border:0;border-radius:14px;padding:11px 0;background:var(--raised);font-weight:700;font-size:15px}
.durs button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink)}
.sbtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sbtns .btn{justify-content:center;padding:15px 0;border-radius:20px;font-size:16px;font-weight:800}
.sbtns .btn:not(.primary){border:2px solid var(--accent-line)}
/* главная: «Дальше сегодня» */
.nexthead{display:flex;justify-content:space-between;align-items:baseline}
.nexthead h2{font-size:17px}
.linkbtn{border:0;background:none;padding:0;font-size:14px;font-weight:700;color:var(--accent)}
.nx{background:var(--surface);border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.nx .box{width:24px;height:24px;border-radius:8px;border:2px solid var(--c,var(--s0));flex:none;background:transparent;padding:0}
.nx .box.review{border-style:dashed;border-color:var(--accent)}
.nx .tx{flex:1;min-width:0;border:0;background:none;padding:0;text-align:left}
.nx .tx b{display:block;font-weight:700;overflow-wrap:anywhere}
.nx .tx span{font-size:13px;color:var(--muted);font-weight:600}
.quick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.quick .btn{background:transparent;border-color:var(--line2);font-size:13px;padding:7px 12px}
/* «сил нет» */
.trrow{display:flex;gap:10px;align-items:flex-end}
.trrow svg{width:124px;height:auto;flex:none}
.trb{background:var(--surface);border-radius:20px 20px 20px 6px;padding:12px 14px;font-size:15px;font-weight:700;line-height:1.4}
.tru{align-self:flex-end;background:var(--primary);color:var(--primary-ink);border-radius:20px 20px 6px 20px;padding:10px 14px;font-size:15px;font-weight:700}
.qcard{background:var(--surface);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px}
.qtop{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;color:var(--muted)}
.qprog{display:flex;gap:4px;align-items:center}
.qprog i{width:18px;height:6px;border-radius:3px;background:var(--accent-soft)}
.qprog i.ok{background:var(--ok)}.qprog i.bad{background:var(--warn)}.qprog i.cur{background:var(--pink)}
.qfb{border-radius:14px;padding:9px 12px;font-size:14px;font-weight:700;background:var(--ok-soft);color:var(--ok)}
.qfb.bad{background:var(--warn-soft);color:var(--warn)}
.qq{font-size:20px;font-weight:800;line-height:1.25}
.qform{display:flex;gap:8px}
.qform input{flex:1;min-width:0;border:2px solid var(--accent-soft);border-radius:16px;padding:12px 14px;font-size:16px;background:var(--raised)}
.qform button{width:48px;height:48px;border:0;border-radius:16px;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;flex:none}
.backcard{background:var(--surface);border-radius:18px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700}
/* переписка */
.chat{display:flex;flex-direction:column;gap:8px}
.msg{max-width:86%;padding:9px 13px;border-radius:16px;font-size:14px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--primary);color:var(--primary-ink);border-bottom-right-radius:6px}
.msg.assistant{align-self:flex-start;background:var(--raised);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg .ch{display:block;margin-top:4px;font-size:12px;color:var(--muted)}
.msg.typing{color:var(--muted)}
.micro{align-self:stretch;border:1.5px solid var(--accent-line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;background:var(--surface)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.quizbox{display:flex;flex-direction:column;gap:8px;border:1.5px solid var(--accent-line);border-radius:12px;padding:10px;background:var(--surface)}
.quizbox form{display:flex;gap:6px}
.quizbox input{border-radius:999px;padding:9px 14px}
.qn{font-size:12px;color:var(--muted)}
details.topic{border-bottom:1px solid var(--line);padding:10px 0}
details.topic:last-child{border-bottom:0}
details.topic summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
details.topic summary::-webkit-details-marker{display:none}
.cardlist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.kc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;padding:8px 10px;border-radius:10px;background:var(--raised);font-size:13px}
.kc b{font-weight:500;grid-column:1}
.kc>span{color:var(--muted);grid-column:1}
.kc .iconbtn{grid-column:2;grid-row:1/3}
.genlist{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow:auto}
.genlist label{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;padding:8px 10px;border-radius:10px;background:var(--raised);font-size:13px}
.more{align-self:center;font-size:13px;color:var(--muted);background:none;border:0;text-decoration:underline;text-underline-offset:2px}

/* план */
.blocks{display:flex;flex-direction:column;gap:8px}
.b{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:12px 14px;border:1.5px solid var(--line);border-radius:16px;background:var(--surface);transition:background .5s,border-color .5s}
.b .mark{grid-row:1/3;width:22px;height:22px;border-radius:6px;border:1.8px solid var(--c,var(--s0));display:grid;place-items:center;background:transparent;padding:0;color:var(--accent-ink)}
.b .mark:hover{background:var(--accent-soft)}
.b .mark svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.6;fill:none}
.b .tm{grid-column:2;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.b .tt{grid-column:2;font-weight:700;min-width:0;overflow-wrap:anywhere;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.b .tt:hover{color:var(--accent)}
.b .side{grid-column:3;grid-row:1/3;display:flex;gap:6px}
.b .dot{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block;margin-right:6px;vertical-align:1px}
.b.lesson{background:var(--raised)}
.b.lesson .mark{border:0;background:transparent;color:var(--c)}
.b.done{opacity:.6}
.b.done .mark{background:var(--c,var(--s0));border-color:var(--c,var(--s0))}
.b.done .tt{text-decoration:line-through}
.b.review{background:var(--accent-soft);border-color:var(--accent-line)}
.b.review .mark{border-style:dashed}
.b.new{background:var(--ok-soft);border-color:var(--ok)}
.b.free{border-style:dashed;background:transparent;padding:8px 12px;grid-template-columns:minmax(0,1fr) auto}
.b.free .tm{grid-column:1}
.grades{grid-column:2/4;display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--warn-soft);color:var(--warn);margin-left:6px;vertical-align:1px}
.tag.pin{background:var(--accent-soft);color:var(--accent)}
.note{font-size:13px;color:var(--muted);padding:8px 12px;border-radius:10px;background:var(--raised)}
.warnbox{font-size:13px;padding:10px 12px;border-radius:10px;background:var(--warn-soft)}
.empty{color:var(--muted);font-size:14px;margin:0;padding:6px 0}
.progress{height:6px;border-radius:999px;background:var(--raised);overflow:hidden}
.progress i{display:block;height:100%;background:var(--ok);border-radius:999px}

/* неделя */
.week{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;align-items:start}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.day.today{border-color:var(--accent-line);box-shadow:0 0 0 2px var(--accent-soft)}
.dayhead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.dayhead b{font-weight:600}
.wb{display:flex;gap:8px;align-items:baseline;padding:6px 8px;border-radius:8px;font-size:13px;line-height:1.35;background:var(--raised);border:0;text-align:left;width:100%}
.wb:hover{background:var(--accent-soft)}
.wb .tm{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none;min-width:84px}
.wb .dot{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none;align-self:center}
.wb.lesson{background:transparent;box-shadow:inset 0 0 0 1px var(--line2)}

/* списки */
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .meta{font-size:12px;color:var(--muted)}
.li .t{font-weight:500;background:none;border:0;padding:0;text-align:left}
.li button.t:hover{color:var(--accent)}
.steps{display:flex;gap:4px;margin-top:4px}
.steps i{width:16px;height:6px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--ok)}
.week-free{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:center}
.week-free label{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;white-space:nowrap}

/* формы */
input[type=text],input[type=time],input[type=date],input[type=number],select,textarea{width:100%;min-width:0;background:var(--raised);border:1px solid var(--line2);border-radius:10px;padding:10px 12px}
textarea{min-height:90px;resize:vertical}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.days{display:flex;gap:6px;flex-wrap:wrap}
.daybtn{width:40px;height:36px;border-radius:9px;border:1px solid var(--line2);background:var(--surface);font-size:13px;font-weight:500}
.daybtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
dialog{border:0;border-radius:18px;padding:0;width:min(520px,calc(100vw - 24px));max-height:calc(100vh - 40px);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(15,17,21,.45)}
dialog form{padding:18px;display:flex;flex-direction:column;gap:12px}
.dlgfoot{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:4px}

/* композер и меню */
.composer{display:flex;gap:8px;align-items:center}
.composer input{border-radius:999px;padding:11px 16px;background:var(--surface);border:1px solid var(--line2)}
.send{width:44px;height:44px;flex:none;border-radius:50%;border:0;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center}
.send:disabled{opacity:.5;cursor:wait}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:transparent}
.dock .composer{max-width:640px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--bg)}
.nav{display:flex;justify-content:space-around;max-width:640px;margin:0 auto;background:var(--surface);border-radius:26px 26px 0 0;padding:10px max(14px,env(safe-area-inset-right,0px)) calc(26px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));box-shadow:0 -6px 24px rgba(27,22,32,.06)}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--muted);padding:6px 10px;border-radius:14px;min-width:64px}
.nav button[aria-current="page"]{color:var(--accent);background:var(--accent-soft);font-weight:800}
.nav .ico{width:22px;height:22px;stroke-width:2}
.chatcol{display:none}

@media (min-width:1000px){
  .shell{grid-template-columns:minmax(0,1fr) 400px}
  .main{max-width:760px;padding-bottom:40px}
  .toptabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;align-self:flex-start}
  .toptabs button{border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:500;font-size:14px;color:var(--muted)}
  .toptabs button[aria-current="page"]{background:var(--primary);color:var(--primary-ink)}
  .dock{display:none}
  .chatcol{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;border-left:1px solid var(--line);background:var(--surface)}
  .chatcol .head{padding:18px 18px 10px;border-bottom:1px solid var(--line)}
  .chatcol .chat{flex:1;overflow:auto;padding:16px 18px}
  .chatcol .composer{padding:12px 18px 16px;border-top:1px solid var(--line)}

<body>

<dialog id="dlg"><form method="dialog" id="dlgform"></form></dialog>

<script type="module">
import * as C from "/core.js";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const U = new URLSearchParams(location.search).get("u");
const VIEWS = [["today", "Сегодня", "i-today"], ["week", "Неделя", "i-week"], ["topics", "Знания", "i-topics"], ["chat", "Козя", "i-chat"], ["setup", "Расписание", "i-set"]];
let S = null, view = (location.hash || "#today").slice(1), highlight = new Set(), saving = false, savePending = false, thinking = false, todayBlocks = [], showAllChat = false;
let quiz = null; const openTopics = new Set();
if (!VIEWS.some(v => v[0] === view) && view !== "session" && view !== "day") view = "today";

const COLORS = ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)", "var(--s5)"];
const color = subj => { if (!subj || subj === "Школа") return "var(--s0)"; const i = S.subjects.findIndex(x => x.name === subj); return COLORS[(i >= 0 ? i : [...subj].reduce((a, c) => a + c.charCodeAt(0), 0)) % COLORS.length]; };
const pad = n => String(n).padStart(2, "0");
function now() { const d = new Date(); return { today: `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`, min: d.getHours() * 60 + d.getMinutes(), hhmm: `${pad(d.getHours())}:${pad(d.getMinutes())}` }; }
const pick = a => a[Math.floor(Math.random() * a.length)];
const icon = (id, cls = "ico") => `<svg class="${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;
const subjOptions = sel => [...S.subjects.map(x => x.name), "Школа", "Другое"].map(n => `<option${n === sel ? " selected" : ""}>${esc(n)}</option>`).join("");
const word = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 10 || h >= 20) ? b : c; };

const ASK = ["Окей, сегодня без подвигов 🫶 Остальное я тихо перенесла на другие дни. Но может, одну малюсенькую штуку? Это 5 минут, честно. Ну пожалуйста",
  "Понимаю, бывает 💛 Давай так: одно крошечное дело на 5 минут — и свободна. Ну пожааалуйста?",
  "Отдых — тоже часть подготовки. Но одну мааленькую штучку, а? 5 минут, я засеку 🥺"];
const PRAISE = ["Ты молодец!! 🎉 А может, ещё одну? Тоже 5 минут. Но если нет — ты сегодня уже красавица, отдыхай.",
  "Вот это да, сделала! 💪 Ещё одну крошечную? Если нет — всё, ты заслужила отдых.",
  "Умница! ✨ Может, на волне ещё 5 минут? А если нет — ты и так сегодня молодец."];

function flash(t) { const s = $("#status"); s.textContent = t || ""; s.hidden = !t; }

// ---------- загрузка и сохранение ----------
async function load() {
  if (!U) { flash("Открой свою личную ссылку на план — в ней есть код после «?u=»."); $("#date").textContent = ""; return; }
  try {
    const r = await fetch(`/api/app?u=${encodeURIComponent(U)}`, { cache: "no-store" });
    const j = await r.json();
    if (!r.ok) { flash(j.error || "Не удалось загрузить план."); return; }
    S = j.state; S.chat ||= []; S.extraLessons ||= []; S.cards ||= []; flash(""); $("#dock").hidden = false; render();
  } catch { flash("Нет связи. Проверь интернет и обнови страницу."); }
}
async function save() {
  if (saving) { savePending = true; return; }
  saving = true;
  try {
    const r = await fetch("/api/app", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ u: U, state: S }) });
    const j = await r.json();
    if (r.status === 409) { S = j.state; flash("План обновился с другого устройства — показываю свежую версию."); render(); }
    else if (!r.ok) flash(j.error || "Не удалось сохранить. Проверь интернет.");
    else { S.rev = j.state.rev; if (($("#status").textContent || "").startsWith("Не удалось")) flash(""); }
  } catch { flash("Не удалось сохранить. Проверь интернет — попробую ещё раз при следующем действии."); }
  saving = false;
  if (savePending) { savePending = false; save(); }
}
const change = fn => { fn(); render(); save(); };
const say = (role, text, extra) => C.pushChat(S, role, text, extra);

// ---------- Козя ----------
const INK = "#1B1620", FACE = "#F8D3DC", CHEEK = "#F29BB2";
function goatBase(ears = 14) {
  return `<path d="M76 58 C66 38 66 20 74 6 C82 24 88 38 92 52 Z" fill="${INK}"/><path d="M124 58 C134 38 134 20 126 6 C118 24 112 38 108 52 Z" fill="${INK}"/>
  <ellipse cx="44" cy="92" rx="25" ry="12" fill="${INK}" transform="rotate(-${ears} 44 92)"/><ellipse cx="47" cy="93" rx="15" ry="6" fill="${FACE}" transform="rotate(-${ears} 47 93)"/>
  <ellipse cx="156" cy="92" rx="25" ry="12" fill="${INK}" transform="rotate(${ears} 156 92)"/><ellipse cx="153" cy="93" rx="15" ry="6" fill="${FACE}" transform="rotate(${ears} 153 93)"/>
  <circle cx="100" cy="100" r="46" fill="${FACE}"/><ellipse cx="100" cy="72" rx="44" ry="24" fill="#FFFFFF"/>
  ${[62, 76, 91, 109, 124, 138].map((x, i) => `<circle cx="${x}" cy="${[84, 90, 92, 92, 90, 84][i]}" r="11" fill="#FFFFFF"/>`).join("")}
  <circle cx="100" cy="66" r="2.4" fill="${INK}"/><circle cx="84" cy="72" r="2" fill="${INK}"/><circle cx="116" cy="72" r="2" fill="${INK}"/>
  <circle cx="68" cy="128" r="7" fill="${CHEEK}"/><circle cx="132" cy="128" r="7" fill="${CHEEK}"/>`;
}
const openEyes = `<ellipse cx="84" cy="114" rx="11" ry="13" fill="#FFFFFF" stroke="${INK}" stroke-width="2"/><ellipse cx="116" cy="114" rx="11" ry="13" fill="#FFFFFF" stroke="${INK}" stroke-width="2"/>
  <circle cx="85" cy="116" r="7" fill="${INK}"/><circle cx="115" cy="116" r="7" fill="${INK}"/><circle cx="87.5" cy="113" r="2.4" fill="#FFFFFF"/><circle cx="117.5" cy="113" r="2.4" fill="#FFFFFF"/>
  <path d="M75 104 L71 99 M80 101 L78 96 M86 100 L87 95 M125 104 L129 99 M120 101 L122 96 M114 100 L113 95" stroke="${INK}" stroke-width="2" stroke-linecap="round"/>`;
const closedEyes = `<path d="M74 116 Q84 108 94 116 M106 116 Q116 108 126 116" fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round"/><path d="M73 111 L69 107 M126 111 L130 107" stroke="${INK}" stroke-width="2" stroke-linecap="round"/>`;
function mascot(mood = "happy", label = "Козя") {
  let body = `<rect x="60" y="126" width="80" height="58" rx="28" fill="${INK}"/><ellipse cx="100" cy="160" rx="18" ry="13" fill="${FACE}"/>`, face = "", extra = "", front = "", ears = 14;
  if (mood === "happy") {
    extra = `<path d="M140 140 C158 128 164 112 160 100" fill="none" stroke="${INK}" stroke-width="13" stroke-linecap="round"/><path d="M62 142 C50 150 48 162 54 170" fill="none" stroke="${INK}" stroke-width="13" stroke-linecap="round"/>`;
    face = openEyes + `<circle cx="96" cy="128" r="1.6" fill="${INK}"/><circle cx="104" cy="128" r="1.6" fill="${INK}"/><path d="M92 134 Q100 141 108 134" fill="none" stroke="${INK}" stroke-width="2.5" stroke-linecap="round"/>`;
  } else if (mood === "focus") {
    face = closedEyes + `<path d="M95 134 L105 134" stroke="${INK}" stroke-width="2.5" stroke-linecap="round"/>`;
    extra = `<path d="M66 150 L100 158 L134 150 L134 186 L100 194 L66 186 Z" fill="#FFFFFF" stroke="${INK}" stroke-width="2.5" stroke-linejoin="round"/><path d="M100 158 V194" stroke="${INK}" stroke-width="2"/><path d="M76 162 L92 165 M76 170 L92 173 M108 165 L124 162 M108 173 L124 170" stroke="#E2557A" stroke-width="2" stroke-linecap="round"/>`;
  } else if (mood === "plead") {
    ears = 30;
    face = `<path d="M72 100 Q80 97 92 103 M128 100 Q120 97 108 103" fill="none" stroke="${INK}" stroke-width="2.5" stroke-linecap="round"/>
      <ellipse cx="84" cy="116" rx="12" ry="14" fill="#FFFFFF" stroke="${INK}" stroke-width="2"/><ellipse cx="116" cy="116" rx="12" ry="14" fill="#FFFFFF" stroke="${INK}" stroke-width="2"/>
      <circle cx="84" cy="119" r="9" fill="${INK}"/><circle cx="116" cy="119" r="9" fill="${INK}"/><circle cx="87" cy="115" r="3.2" fill="#FFFFFF"/><circle cx="119" cy="115" r="3.2" fill="#FFFFFF"/>
      <circle cx="81" cy="122" r="1.6" fill="#FFFFFF"/><circle cx="113" cy="122" r="1.6" fill="#FFFFFF"/><ellipse cx="100" cy="138" rx="4" ry="5" fill="${INK}"/>`;
    front = `<path d="M80 168 C88 156 96 156 100 162 C104 156 112 156 120 168" fill="${INK}" stroke="${INK}" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>`;
  } else { // rest
    face = closedEyes + `<path d="M94 133 Q100 137 106 133" fill="none" stroke="${INK}" stroke-width="2.5" stroke-linecap="round"/>`;
    extra = `<text x="150" y="58" font-family="Nunito, sans-serif" font-size="22" font-weight="800" fill="#B8325E">z</text><text x="164" y="40" font-family="Nunito, sans-serif" font-size="16" font-weight="800" fill="#B8325E">z</text>`;
  }
  return `<svg viewBox="0 0 200 196" role="img" aria-label="${esc(label)}"><ellipse cx="100" cy="190" rx="52" ry="6" fill="#E9C3D1"/>${body}${extra}${goatBase(ears)}${face}${front}</svg>`;
}
function streakDays(today) {
  let n = 0;
  for (let i = 0; i < 120; i++) {
    const d = C.addDays(today, -i);
    const has = (S.log[d] || []).length > 0;
    if (has) { n++; continue; }
    if (i === 0) continue; // сегодня ещё может быть впереди
    const f = S.free[C.weekday(d)];
    if (f?.off || S.avail[d]?.off) continue; // выходной не рвёт серию
    break;
  }
  return n;
}
function nextUp(live) { return live.find(b => b.type === "task" || b.type === "habit") || live.find(b => b.type === "review") || null; }

// ---------- таймер-сессия ----------
const SKEY = "ege-session-" + (U || "");
let session = null;
try { session = JSON.parse(localStorage.getItem(SKEY) || "null"); } catch {}
const keepSession = () => { try { session ? localStorage.setItem(SKEY, JSON.stringify(session)) : localStorage.removeItem(SKEY); } catch {} };
const leftMs = () => !session ? 0 : session.endAt ? Math.max(0, session.endAt - Date.now()) : session.left;
const fmt = ms => { const t = Math.ceil(ms / 1000); return `${String(Math.floor(t / 60)).padStart(2, "0")}:${String(t % 60).padStart(2, "0")}`; };
function startSession(b) {
  if (b.type === "review") { startQuiz({ topicId: b.ref, n: 5, mode: "topic" }); return; }
  const len = S.sessionMin || 25;
  session = { ref: b.ref, type: b.type, title: b.title, subject: b.subject, len, phase: "work", endAt: Date.now() + len * 60000, left: len * 60000 };
  keepSession(); view = "session"; history.replaceState(null, "", "#session"); render(); scrollTo(0, 0);
}
function sessionTick() {
  if (!S) return;
  if (!session) { document.title = "Мой план ЕГЭ"; return; }
  const left = leftMs();
  document.title = `${fmt(left)} · ${session.phase === "work" ? session.title : "перерыв"}`;
  const t = $("#sess-time"); if (t) t.textContent = fmt(left);
  const mt = $("#mini-time"); if (mt) mt.textContent = fmt(left);
  const ring = $("#sess-ring"); if (ring) { const total = session.len * 60000; ring.setAttribute("stroke-dashoffset", String(Math.round(679 * (1 - left / total)))); }
  if (session.endAt && left <= 0) finishPhase();
}
function finishPhase(early = false) {
  if (!session) return;
  try { navigator.vibrate?.([200, 100, 200]); } catch {}
  if (session.phase === "work") {
    const n = now();
    change(() => C.markDone(S, n.today, { type: session.type, ref: session.ref, title: session.title, subject: session.subject, start: Math.max(0, n.min - (early ? Math.round((session.len * 60000 - leftMs()) / 60000) : session.len)) }));
    session = { ...session, phase: "break", len: 5, endAt: Date.now() + 5 * 60000, left: 5 * 60000 };
    keepSession(); if (view === "session") render();
  } else {
    session = null; keepSession(); document.title = "Мой план ЕГЭ";
    if (view === "session") { view = "today"; history.replaceState(null, "", "#today"); }
    render(); flash("");
  }
}
function renderSession() {
  if (!session) return `<div class="card"><p class="empty">Сессии сейчас нет.</p><button class="btn" data-view="today" type="button">К плану</button></div>`;
  const work = session.phase === "work", left = leftMs(), paused = !session.endAt;
  return `<div class="session">
    <div class="shead"><button class="circbtn" data-act="session-back" type="button" aria-label="Назад"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <b style="font-size:17px;font-weight:800">${work ? "Сессия" : "Перерыв"}</b><span style="width:44px"></span></div>
    <div style="text-align:center;font-size:15px;font-weight:700;color:var(--muted)">${work ? (paused ? "Пауза — Козя ждёт тебя" : "Козя сосредоточилась вместе с тобой") : "Перерыв! Попей воды и разомнись"}</div>
    <div class="ring"><svg viewBox="0 0 240 240" aria-hidden="true"><circle cx="120" cy="120" r="108" fill="none" stroke="var(--accent-soft)" stroke-width="14"/>
      <circle id="sess-ring" cx="120" cy="120" r="108" fill="none" stroke="${work ? "var(--pink)" : "var(--ok)"}" stroke-width="14" stroke-linecap="round" stroke-dasharray="679" stroke-dashoffset="${Math.round(679 * (1 - left / (session.len * 60000)))}" transform="rotate(-90 120 120)"/></svg>
      <div style="position:absolute;inset:16%;display:grid;place-items:center">${mascot(work ? "focus" : "happy", work ? "Козя читает книжку" : "Козя радуется")}</div></div>
    <div style="text-align:center;display:flex;flex-direction:column;gap:4px"><div class="big" id="sess-time" aria-live="off">${fmt(left)}</div>
      <div style="font-size:16px;font-weight:700">${esc(work ? session.title : "Отдых")}</div>
      <div style="font-size:14px;color:var(--muted);font-weight:600">${work ? `${session.len} минут · потом 5 минут отдыха` : "потом можно браться за следующее"}</div></div>
    ${work ? `<div class="card" style="gap:10px;border-radius:22px;padding:14px"><b style="font-size:14px;font-weight:800">Длина сессии</b><div class="durs">${[25, 30, 45, 5].map(m => `<button type="button" data-dur="${m}" aria-pressed="${session.len === m}">${m} мин</button>`).join("")}</div></div>` : ""}
    <div class="sbtns"><button class="btn" data-act="session-pause" type="button">${paused ? "Продолжить" : "Пауза"}</button>
      <button class="btn primary" data-act="session-done" type="button">${work ? "Сделала раньше" : "Пропустить перерыв"}</button></div>
    ${work ? `<button class="more" data-act="session-cancel" type="button">Отменить сессию</button>` : ""}
  </div>`;
}
setInterval(sessionTick, 500);

// ---------- отрисовка ----------
function render() {
  const n = now();
  $("#date").textContent = `${C.DAYS_FULL[C.weekday(n.today)]}, ${C.humanDate(n.today)}`;
  $("#hello").textContent = S.name ? `Привет, ${S.name}!` : "Мой план";
  const sd = streakDays(n.today);
  $("#streak").innerHTML = true ? `<div class="streak" title="Дней подряд с занятиями"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E0702B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-3.5 2-5 1 1.5 2 2 3-5z"/></svg>${sd} ${word(sd, "день", "дня", "дней")}</div>` : "";
  const navHTML = VIEWS.filter(v => v[0] !== "setup").map(([id, label, ic]) => `<button type="button" data-view="${id}" class="${id === "chat" ? "navchat" : ""}" ${view === id || (id === "today" && view === "day") ? 'aria-current="page"' : ""}>${icon(ic)}<span>${label}</span></button>`).join("");
  $("#nav").innerHTML = navHTML;
  $("#toptabs").innerHTML = VIEWS.filter(v => v[0] !== "chat").map(([id, label]) => `<button type="button" data-view="${id}" ${view === id ? 'aria-current="page"' : ""}>${label}</button>`).join("");
  $("#composer-m").hidden = view !== "chat";
  $("#dock").hidden = view === "session";
  const tiredNow = view === "today" && S.tired[n.today] && !S.tired[n.today].rest;
  document.querySelector(".top").hidden = view === "session" || !!tiredNow;
  const plan = C.buildPlan(S, n.today, 7, n.min);
  const v = view === "chat" && matchMedia("(min-width:1000px)").matches ? "today" : view;
  $("#view").innerHTML = v === "session" ? renderSession() : v === "day" ? renderDay(plan[0], n) : v === "today" ? renderToday(plan[0], n) : v === "week" ? renderWeek(plan) : v === "topics" ? renderTopics(n) : v === "setup" ? renderSetup() : renderChatView(n);
  $("#chat-desk").innerHTML = chatHTML(n, 60);
  const cd = $("#chat-desk"); cd.scrollTop = cd.scrollHeight;
  if (v === "chat") scrollTo(0, document.body.scrollHeight);
}

function chatHTML(n, limit) {
  const list = (S.chat || []).slice(-limit);
  let h = list.length ? list.map(m => `<div class="msg ${m.role}">${esc(m.text)}${m.changes?.length ? `<span class="ch">Изменила: ${esc(m.changes.join("; "))}</span>` : ""}</div>`).join("")
    : `<div class="msg assistant">Привет${S.name ? ", " + esc(S.name) : ""}! Пиши мне всё, что меняется: «завтра зачёт по обществу», «англ отменили», «вернусь поздно». Я сама переставлю план 💙</div>`;
  if (thinking) h += `<div class="msg assistant typing">Думаю…</div>`;
  h += quiz ? quizWidget() : tiredWidget(n);
  return `<div class="chat">${h}</div>`;
}
function tiredWidget(n) {
  const t = S.tired[n.today];
  if (!t || t.rest) return "";
  const o = C.microOptions(S, n.today)[0];
  if (!o) return "";
  return `<div class="micro">${icon("i-check")}<div><div class="small muted">${o.min} минут${o.subject ? " · " + esc(o.subject) : ""}</div><div style="font-weight:500">${esc(o.title)}</div></div></div>

// ---------- опрос по карточкам ----------
let generating = false, tiredRef = "quiz";
async function startQuiz({ topicId = null, subject = null, topicTitle = null, n = 5, mode = "free" } = {}) {
  if (generating) return;
  const d = now().today;
  if (topicTitle && !topicId) topicId = S.topics.find(t => t.title.toLowerCase() === String(topicTitle).toLowerCase())?.id || null;
  if (subject && !S.subjects.some(x => x.name === subject)) subject = S.subjects.find(x => x.name.toLowerCase().startsWith(String(subject).toLowerCase().slice(0, 5)))?.name || null;
  let cards = C.pickCards(S, { topicId, subject, n, today: d });
  // карточек мало — помощник сам придумывает вопросы и сохраняет их в базу
  if (cards.length < Math.min(n, 3)) {
    const topic = topicId ? S.topics.find(t => t.id === topicId) : null;
    const subj = topic?.subject || subject || pickSubject();
    const theme = topic?.title || topicTitle || `ключевые термины, даты и факты, которые чаще всего спрашивают на ЕГЭ по предмету «${subj}»`;
    generating = true; thinking = true;
    say("assistant", "Секунду, придумываю тебе вопросы…"); render();
    let fresh = [];
    try {
      const r = await fetch("/api/ai", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ u: U, mode: "cards", topic: theme, subject: subj, n: Math.max(n, 3) + 1 }) });
      const j = await r.json(); fresh = j.cards || [];
    } catch {}
    generating = false; thinking = false;
    S.chat = S.chat.filter(m => m.text !== "Секунду, придумываю тебе вопросы…");
    if (fresh.length) { C.addCards(S, fresh, { topicId: topic?.id || null, subject: subj, source: "ai" }); save(); }
    cards = C.pickCards(S, { topicId, subject: topicId ? null : (subject || subj), n, today: d });
    if (!cards.length) cards = C.pickCards(S, { n, today: d });
  }
  if (!cards.length) {
    change(() => say("assistant", "Не получилось придумать вопросы — помощник сейчас недоступен 🙈 Попробуй через минуту или добавь карточки в разделе «Знания»."));
    return;
  }
  const first = mode === "tired" ? "Тогда так: 3 быстрых вопроса, отвечай как помнишь 🙂" : mode === "topic" ? "Давай проверим тему — отвечай своими словами 🙂" : `Поехали! ${cards.length} ${word(cards.length, "вопрос", "вопроса", "вопросов")}, отвечай своими словами 🙂`;
  quiz = { cards, i: 0, phase: "ask", mode, topicId, results: [], log: [{ role: "assistant", text: first }, { role: "assistant", text: cards[0].q }] };
  quiz.intro = mode === "tired" ? first : null;
  if (!matchMedia("(min-width:1000px)").matches) { view = mode === "tired" ? "today" : "chat"; history.replaceState(null, "", "#" + view); }
  render(); focusQuiz();
}
function pickSubject() {
  const list = S.subjects.filter(x => x.name);
  if (!list.length) return "Обществознание";
  const w = list.map(x => Math.max(3, (x.target ?? 100) - (x.current ?? 70)));
  let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < list.length; i++) { r -= w[i]; if (r <= 0) return list[i].name; }
  return list[0].name;
}
function focusQuiz() { setTimeout(() => { const f = [...document.querySelectorAll("form[data-quiz] input")].find(x => x.offsetParent); f?.focus(); }, 30); }
async function answerQuiz(text) {
  const q = quiz, c = q.cards[q.i], d = now().today;
  q.log.push({ role: "user", text }); q.phase = "checking"; render();
  let verdict = null, comment = "";
  try {
    const r = await fetch("/api/ai", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ u: U, mode: "check", q: c.q, a: c.a, answer: text }) });
    const j = await r.json(); if (r.ok) { verdict = j.verdict; comment = j.comment || ""; }
  } catch {}
  if (quiz !== q) return;
  if (!verdict) { q.log.push({ role: "assistant", text: `Правильный ответ: ${c.a}` }); q.fb = { ok: true, text: `Правильный ответ: ${c.a}` }; q.phase = "self"; render(); return; }
  const ok = verdict === "yes" ? true : verdict === "no" ? false : "partly";
  q.results.push(ok); C.recordAnswer(S, c.id, ok, d);
  q.fb = { ok: verdict !== "no", text: verdict === "yes" ? `Верно! ${comment}`.trim() : verdict === "partly" ? `Почти. Полностью: ${c.a}` : `Не совсем. Правильно: ${c.a}` };
  q.log.push({ role: "assistant", text: verdict === "yes" ? `Верно! ✅ ${comment}` : verdict === "partly" ? `Почти 👌 ${comment} Полностью: ${c.a}` : `Не совсем. Правильно: ${c.a}${comment ? " — " + comment : ""}` });
  q.phase = "result"; render(); save();
}
function quizSelf(ok) { const q = quiz, c = q.cards[q.i]; q.results.push(ok); q.fb = { ok, text: ok ? `Отлично! ${c.a}` : `Запомни: ${c.a}` }; C.recordAnswer(S, c.id, ok, now().today); q.log.push({ role: "user", text: ok ? "Знала" : "Не знала" }); q.phase = "result"; render(); save(); }
function quizNext() {
  const q = quiz;
  if (q.i + 1 < q.cards.length) { q.i++; q.phase = "ask"; q.log.push({ role: "assistant", text: q.cards[q.i].q }); render(); focusQuiz(); return; }
  finishQuiz();
}
function finishQuiz() {
  const q = quiz; quiz = null; if (!q) return;
  const n = now(), total = q.results.length;
  const score = q.results.reduce((a, r) => a + (r === true ? 1 : r === "partly" ? 0.5 : 0), 0);
  change(() => {
    if (!total) { say("assistant", "Окей, в другой раз 🙂"); return; }
    say("assistant", `Итог: ${score % 1 ? score.toFixed(1).replace(".", ",") : score} из ${total} 🎯 ${score / total >= 0.8 ? "Отлично держишь!" : score / total >= 0.4 ? "Неплохо, трудные вопросы спрошу пораньше." : "Ничего, эти карточки я спрошу снова совсем скоро."}`);
    if (q.mode === "topic" && q.topicId && !(S.log[n.today] || []).some(x => x.kind === "review" && x.ref === q.topicId)) {
      const ratio = score / total;
      C.gradeReview(S, n.today, q.topicId, ratio >= 0.8 ? "easy" : ratio >= 0.4 ? "hard" : "forgot", n.min);
    }
    if (q.mode === "tired" && S.tired[n.today]) {
      (S.log[n.today] ||= []).push({ kind: "micro", ref: tiredRef, title: `Ответила на ${total} ${word(total, "вопрос", "вопроса", "вопросов")}`, subject: "", start: n.hhmm, end: C.toHHMM(Math.min(n.min + 5, 1439)) });
      S.tired[n.today].micro = (S.tired[n.today].micro || 0) + 1;
      say("assistant", pick(PRAISE));
    }
  });
}

  const key = `${date}|${b.type}|${b.ref}|${b.start}`;
  if (b.type === "free") return `<div class="b free"><span class="tm">${time} · свободно</span><button class="btn sm" data-act="new-task" data-at="${C.toHHMM(b.start)}" type="button">${icon("i-plus")}Сюда задачу</button></div>`;
  if (b.type === "lesson") return `<div class="b lesson" style="--c:${c}"><span class="mark">${icon("i-week")}</span><span class="tm">${time} · занятие</span><button class="tt" data-edit-lesson="${b.ref}" type="button"><span class="dot"></span>${esc(b.title)}</button></div>`;
  if (b.type === "done") {
    const lbl = b.kind === "review" ? "повторила" : b.kind === "micro" ? "маленький шаг" : "сделано";
    return `<div class="b done" style="--c:${c}"><button class="mark" data-undo="${b.idx}" type="button" aria-label="Вернуть: ${esc(b.title)}">${icon("i-check", "")}</button><span class="tm">${time} · ${lbl}</span><span class="tt">${esc(b.title)}</span></div>`;
  }
  const cls = ["b", b.type, highlight.has(key) ? "new" : ""].join(" ");
  if (b.type === "review") {
    return `<div class="${cls}" style="--c:${c}"><span class="mark"></span><span class="tm">${time} · повторение, ${(b.step || 0) + 1}-й раз${b.overdue ? " · пропущенное" : ""}</span><span class="tt"><span class="dot"></span>${esc(b.title)}</span>
      <div class="grades"><button class="btn soft sm" data-quiz-topic="${b.ref}" type="button">Проверь меня</button><span class="small muted" style="align-self:center">или отметь сама:</span><button class="btn sm" data-grade="easy" data-ref="${b.ref}" data-start="${b.start}" type="button">Легко</button><button class="btn sm" data-grade="hard" data-ref="${b.ref}" data-start="${b.start}" type="button">С трудом</button><button class="btn sm" data-grade="forgot" data-ref="${b.ref}" data-start="${b.start}" type="button">Забыла</button></div></div>`;
  }
  const t = b.type === "task" ? S.tasks.find(x => x.id === b.ref) : null;
  const meta = [`${time}`, b.count > 1 ? `${b.count} × ${S.sessionMin} мин` : `${S.sessionMin} мин`, t?.due ? `срок ${t.due === date ? "сегодня" : C.humanDate(t.due)}${t.dueTime ? " " + t.dueTime : ""}` : ""].filter(Boolean).join(" · ");
  return `<div class="${cls}" style="--c:${c}"><button class="mark" data-done="${b._i}" type="button" aria-label="Сделала ${S.sessionMin} минут: ${esc(b.title)}"></button><span class="tm">${esc(meta)}</span>
    <button class="tt" ${t ? `data-edit-task="${t.id}"` : ""} type="button"><span class="dot"></span>${esc(b.title)}${b.overdue ? '<span class="tag">просрочено</span>' : ""}${b.pinned ? '<span class="tag pin">по времени</span>' : ""}</button>
    <button class="play" data-start="${b.type}|${b.ref}" type="button" aria-label="Начать сессию: ${esc(b.title)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></button></div>`;
}

function tasksCard() {
  const list = S.tasks.filter(t => t.done < t.sessions).sort((a, b) => (a.due || "9999").localeCompare(b.due || "9999"));
  return `<div class="card"><div class="cardhead"><h2>Все задачи</h2><button class="btn sm" data-act="new-task" type="button">${icon("i-plus")}Добавить</button></div>
    ${list.length ? `<div class="list">${list.map(t => `<div class="li"><div><button class="t" data-edit-task="${t.id}" type="button">${esc(t.title)}</button>
      <div class="meta">${esc([t.subject, `${t.done} из ${t.sessions} по ${S.sessionMin} мин`, t.due ? "срок " + C.humanDate(t.due) + (t.dueTime ? " " + t.dueTime : "") : "без срока", t.pin ? `по времени: ${C.humanDate(t.pin.date)} ${t.pin.from}` : ""].filter(Boolean).join(" · "))}</div>
      <div class="progress" style="margin-top:6px"><i style="width:${t.done / t.sessions * 100}%"></i></div></div>
      <button class="iconbtn" data-edit-task="${t.id}" type="button" aria-label="Изменить ${esc(t.title)}">${icon("i-edit")}</button></div>`).join("")}</div>` : `<p class="empty">Задач нет. Добавь сама или напиши помощнику.</p>`}</div>`;
}

function renderWeek(plan) {
  return `<div class="row"><button class="btn" data-act="new-task" type="button">${icon("i-plus")}Задача</button><button class="btn" data-act="new-event" type="button">${icon("i-plus")}Разовое событие</button><button class="btn" data-view="setup" type="button">${icon("i-set")}Расписание</button></div>
  <div class="week">${plan.map(d => {
    const items = C.mergeBlocks(d.blocks.filter(b => b.type !== "done"));
    const doneN = (S.log[d.date] || []).length;
    const ov = S.avail[d.date];
    let body = "";
    if (d.off) body = `<p class="empty">Выходной</p>`;
    else if (d.tired) body = `<p class="empty">Режим «сил нет»</p>`;
    else {
      body = d.notes.map(nt => `<button class="wb lesson" style="--c:${color(nt.subject)}" data-edit-lesson="${nt.id}" type="button"><span class="tm">время?</span><span>${esc(nt.title)}</span></button>`).join("");
      body += items.map(b => {
        const attr = b.type === "task" ? `data-edit-task="${b.ref}"` : b.type === "lesson" && !String(b.ref).startsWith("x") ? `data-edit-lesson="${b.ref}"` : b.type === "lesson" ? `data-edit-event="${b.ref}"` : b.type === "review" ? `data-view="topics"` : "";
        return `<button class="wb ${b.type}" style="--c:${color(b.subject)}" ${attr} type="button"><span class="tm">${C.toHHMM(b.start)}–${C.toHHMM(b.end)}</span><span class="dot"></span><span>${esc(b.title)}${b.count > 1 ? ` <span class="muted">· ${b.count}×${S.sessionMin}</span>` : ""}${b.type === "review" ? ' <span class="muted">· повторение</span>' : ""}</span></button>`;
      }).join("");
      if (!items.length && !d.notes.length) body += `<p class="empty">Свободный день</p>`;
      if (d.unplaced.length) body += `<div class="warnbox">Не влезает: ${d.unplaced.map(u => esc(u.title)).join(", ")}</div>`;
    }
    return `<div class="day${d.isToday ? " today" : ""}"><div class="dayhead"><div><b>${C.DAYS[d.wd]}${d.isToday ? " · сегодня" : ""}</b> <span class="small muted">${C.humanDate(d.date)}${doneN ? ` · ✓${doneN}` : ""}</span></div>
      <button class="iconbtn" data-edit-day="${d.date}" type="button" aria-label="Время на ${C.humanDate(d.date)}" title="Изменить время дня">${icon("i-edit")}</button></div>
      ${ov ? `<div class="small muted">${ov.off ? "в этот день без подготовки" : `свободна ${ov.from}–${ov.to}`}</div>` : ""}${body}</div>`;
  }).join("")}</div>${tasksCard()}`;
}

function renderTopics(n) {
  const doneToday = new Set((S.log[n.today] || []).filter(x => x.kind === "review").map(x => x.ref));
  const steps = t => `<div class="steps" aria-label="Пройдено кругов: ${t.step} из ${C.INTERVALS.length}">${C.INTERVALS.map((_, i) => `<i class="${i < t.step ? "on" : ""}"></i>`).join("")}</div>`;
  const cardsOf = id => S.cards.filter(c => c.topicId === id);
  const cardRow = c => `<div class="kc"><b>${esc(c.q)}</b><button class="iconbtn" data-del-card="${c.id}" type="button" aria-label="Удалить карточку" style="grid-row:1/3">✕</button><span>${esc(c.a)}${c.right + c.wrong ? ` · ${Math.round(c.right)} ✓ ${Math.round(c.wrong)} ✗` : ""}</span></div>`;
  const topicItem = t => {
    const cs = cardsOf(t.id), due = t.next <= n.today && !doneToday.has(t.id);
    return `<details class="topic" data-topic="${t.id}" ${openTopics.has(t.id) ? "open" : ""}><summary><div><div class="t" style="font-weight:500">${esc(t.title)}</div>
      <div class="meta small muted">${esc(t.subject || "")} · ${due ? "<b style=\"color:var(--accent)\">повторить сегодня</b>" : "следующее повторение " + C.humanDate(t.next)} · ${cs.length} ${word(cs.length, "карточка", "карточки", "карточек")}</div>${steps(t)}</div><span class="muted">▾</span></summary>
      ${due ? `<div class="row" style="margin-top:10px"><button class="btn soft sm" data-quiz-topic="${t.id}" type="button">Проверь меня</button><button class="btn sm" data-grade="easy" data-ref="${t.id}" type="button">Легко</button><button class="btn sm" data-grade="hard" data-ref="${t.id}" type="button">С трудом</button><button class="btn sm" data-grade="forgot" data-ref="${t.id}" type="button">Забыла</button></div>` : cs.length ? `<div class="row" style="margin-top:10px"><button class="btn sm" data-quiz-topic="${t.id}" type="button">Проверь меня</button></div>` : ""}
      <div class="cardlist">${cs.map(cardRow).join("")}</div>
      <div class="row" style="margin-top:8px"><button class="btn sm" data-add-cards="${t.id}" type="button">${icon("i-plus")}Карточки</button><button class="btn sm" data-gen-cards="${t.id}" type="button">✨ Придумай карточки</button><button class="btn sm danger" data-del-topic="${t.id}" type="button">Удалить тему</button></div></details>`;
  };
  const sorted = [...S.topics].sort((a, b) => a.next.localeCompare(b.next));
  const loose = S.cards.filter(c => !c.topicId || !S.topics.some(t => t.id === c.topicId));
  let h = `<div class="card"><div class="cardhead"><h2>База знаний</h2><span class="small muted">${S.cards.length} ${word(S.cards.length, "карточка", "карточки", "карточек")}</span></div>
    <p class="small muted" style="margin:0">Темы повторяются через ${C.INTERVALS.join(", ")} дней. Внутри темы — карточки «вопрос → ответ»: по ним я тебя спрашиваю, когда пора повторять или когда сил нет.</p>
    <div class="row"><button class="btn primary" data-act="quiz-any" type="button">Проверь меня · 5 вопросов</button><button class="btn" data-act="learned" type="button">${icon("i-plus")}Тема</button><button class="btn" data-add-cards="" type="button">${icon("i-plus")}Карточки без темы</button></div></div>`;
  h += `<div class="card"><div class="cardhead"><h2>Темы</h2><span class="small muted">${S.topics.length}</span></div>${sorted.length ? sorted.map(topicItem).join("") : `<p class="empty">Пока тем нет. Изучила тему — нажми «+ Тема».</p>`}</div>`;
  if (loose.length) h += `<div class="card"><div class="cardhead"><h2>Карточки без темы</h2><span class="small muted">${loose.length}</span></div><div class="cardlist">${loose.map(cardRow).join("")}</div></div>`;
  return h;
}

function addCardsDialog(topicId) {
  const t = S.topics.find(x => x.id === topicId);
  openDialog(t ? `Карточки: ${esc(t.title)}` : "Новые карточки", `
    <p class="small muted" style="margin:0">Каждая карточка — с новой строки: <b>вопрос или термин — ответ</b>. Например:<br>Инфляция — устойчивый рост общего уровня цен<br>Основание Санкт-Петербурга: 1703</p>
    <label class="field"><span>Карточки</span><textarea id="f-cards" required rows="6" placeholder="Термин — определение"></textarea></label>
    ${t ? "" : `<label class="field"><span>Предмет</span><select id="f-subj">${subjOptions(S.subjects[0]?.name)}</select></label>`}`, {
    submitLabel: "Добавить",
    submit: () => {
      const list = C.parseCardLines(val("f-cards"));
      if (!list.length) { const ta = dlgform.querySelector("#f-cards"); ta.setCustomValidity("Не нашла карточек. Пиши так: вопрос — ответ, каждую с новой строки."); ta.reportValidity(); ta.addEventListener("input", () => ta.setCustomValidity(""), { once: true }); return false; }
      change(() => { const k = C.addCards(S, list, { topicId: t?.id || null, subject: t?.subject || val("f-subj") }); if (t) openTopics.add(t.id); say("assistant", `Добавила ${k} ${word(k, "карточку", "карточки", "карточек")} в базу знаний 📚`); });
    },
  });
}
async function genCards(topicId) {
  const t = S.topics.find(x => x.id === topicId); if (!t) return;
  openDialog(`✨ Карточки: ${esc(t.title)}`, `<p class="small muted" style="margin:0">Придумываю вопросы по теме…</p>`, { submit: () => false, submitLabel: "Подождите" });
  let cards = [];
  try {
    const r = await fetch("/api/ai", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ u: U, mode: "cards", topic: t.title, subject: t.subject, n: 6 }) });
    const j = await r.json(); cards = j.cards || [];
  } catch {}
  if (!dlg.open) return;
  if (!cards.length) { openDialog("Не получилось", `<p class="small muted" style="margin:0">Помощник сейчас не смог придумать карточки. Попробуй ещё раз через минуту или добавь их сама.</p>`, { submit: () => {}, submitLabel: "Понятно" }); return; }
  openDialog(`✨ Карточки: ${esc(t.title)}`, `<p class="small muted" style="margin:0">Проверь факты и сними галочки с лишнего — помощник иногда ошибается.</p>
    <div class="genlist">${cards.map((c, i) => `<label><input type="checkbox" data-gen="${i}" checked><span><b>${esc(c.q)}</b><br><span class="muted">${esc(c.a)}</span></span></label>`).join("")}</div>`, {
    submitLabel: "Добавить выбранные",
    submit: () => {
      const pickd = [...dlgform.querySelectorAll("[data-gen]:checked")].map(x => cards[+x.dataset.gen]);
      change(() => { const k = C.addCards(S, pickd, { topicId: t.id, subject: t.subject, source: "ai" }); openTopics.add(t.id); say("assistant", `Добавила ${k} ${word(k, "карточку", "карточки", "карточек")} к теме «${t.title}». Буду спрашивать на повторениях 📚`); });
    },
  });
}

function renderSetup() {
  const lessons = S.lessons.map(l => `<div class="li"><div><button class="t" data-edit-lesson="${l.id}" type="button">${esc(l.title)}</button><div class="meta">${l.days.map(d => C.DAYS[d]).join(", ") || "дни не выбраны"} · ${l.from && l.to ? `${l.from}–${l.to}` : "время не указано"}</div></div><button class="iconbtn" data-edit-lesson="${l.id}" type="button" aria-label="Изменить">${icon("i-edit")}</button></div>`).join("");
  const n = now();
  const events = S.extraLessons.filter(e => e.date >= n.today).sort((a, b) => (a.date + a.from).localeCompare(b.date + b.from)).map(e => `<div class="li"><div><button class="t" data-edit-event="${e.id}" type="button">${esc(e.title)}</button><div class="meta">${C.humanDate(e.date)} · ${e.from}–${e.to}</div></div><button class="iconbtn" data-edit-event="${e.id}" type="button" aria-label="Изменить">${icon("i-edit")}</button></div>`).join("");
  const habit = S.habits[0];
  return `<div class="card"><div class="cardhead"><h2>Занятия по расписанию</h2><button class="btn sm" data-act="new-lesson" type="button">${icon("i-plus")}Добавить</button></div>${lessons ? `<div class="list">${lessons}</div>` : `<p class="empty">Нет регулярных занятий.</p>`}</div>
  <div class="card"><div class="cardhead"><h2>Разовые события</h2><button class="btn sm" data-act="new-event" type="button">${icon("i-plus")}Добавить</button></div><p class="small muted" style="margin:0">Зачёт, пробник, кружок, поездка — то, что бывает один раз.</p>${events ? `<div class="list">${events}</div>` : ""}</div>
  <div class="card"><h2>Свободное время по дням</h2><p class="small muted" style="margin:0">Когда можно заниматься самой. Занятия вычитаются автоматически.</p>
    <div style="display:flex;flex-direction:column;gap:8px">${S.free.map((f, i) => `<div class="week-free"><b class="small">${C.DAYS[i]}</b><input type="time" id="free-from-${i}" data-free="${i}" data-k="from" value="${esc(f.from)}" aria-label="${C.DAYS[i]}, с" ${f.off ? "disabled" : ""}><input type="time" id="free-to-${i}" data-free="${i}" data-k="to" value="${esc(f.to)}" aria-label="${C.DAYS[i]}, до" ${f.off ? "disabled" : ""}><label><input type="checkbox" id="free-off-${i}" data-free="${i}" data-k="off" ${f.off ? "checked" : ""}> выходной</label></div>`).join("")}</div></div>
  <div class="card"><h2>Как ты занимаешься</h2><div class="grid2">
    <label class="field"><span>Одна сессия</span><select id="set-session" data-set="sessionMin">${[25, 30, 45, 50].map(m => `<option value="${m}" ${S.sessionMin === m ? "selected" : ""}>${m} минут</option>`).join("")}</select></label>
    <label class="field"><span>Максимум в день на самоподготовку</span><select id="set-cap" data-set="dailyCapMin">${[60, 120, 180, 240, 300].map(m => `<option value="${m}" ${S.dailyCapMin === m ? "selected" : ""}>${m / 60} ${word(m / 60, "час", "часа", "часов")}</option>`).join("")}</select></label></div>
    <label class="row small"><input type="checkbox" id="set-habit" ${habit ? "checked" : ""}> Каждый будний день ставить блок «Школьные задания»</label>
    ${(S.capFactor || 1) < 1 ? `<div class="row small"><span class="muted">Сейчас нагрузка облегчена на четверть.</span><button class="btn sm" data-act="unlighten" type="button">Вернуть обычную</button></div>` : ""}</div>
  <div class="card"><h2>Цели по предметам</h2><div class="list">${S.subjects.map(s => `<div class="li"><div><div class="t">${esc(s.name)}</div><div class="meta">сейчас ${s.current ?? "—"} → цель ${s.target ?? "—"}</div><div class="progress" style="margin-top:6px"><i style="width:${s.current || 0}%;background:${color(s.name)}"></i></div></div></div>`).join("")}</div></div>`;
}

// ---------- формы ----------
const dlg = $("#dlg"), dlgform = $("#dlgform");
let dlgSubmit = null, dlgAct = {};
function openDialog(title, body, { submit, actions = {}, submitLabel = "Сохранить" }) {
  dlgSubmit = submit; dlgAct = actions;
  dlgform.innerHTML = `<div class="cardhead"><h2>${title}</h2><button class="iconbtn" value="cancel" formnovalidate type="submit" aria-label="Закрыть">✕</button></div>${body}
    <div class="dlgfoot"><span class="row">${Object.entries(actions).map(([k, a]) => `<button class="btn sm ${a.cls || ""}" type="button" data-dlg="${k}">${a.label}</button>`).join("")}</span>
    <span class="row"><button class="btn" value="cancel" formnovalidate type="submit">Отмена</button><button class="btn primary" value="ok" type="submit">${submitLabel}</button></span></div>`;
  dlg.showModal();
  dlgform.querySelector("input,select,textarea")?.focus();
}
dlgform.addEventListener("submit", e => {
  const v = e.submitter?.value;
  if (v === "ok" && dlgSubmit) { if (dlgSubmit() === false) { e.preventDefault(); return; } }
});
dlgform.addEventListener("click", e => {
  const b = e.target.closest("[data-dlg]"); if (b) { dlgAct[b.dataset.dlg].run(); dlg.close(); return; }
  const d = e.target.closest(".daybtn"); if (d) d.setAttribute("aria-pressed", d.getAttribute("aria-pressed") !== "true");
});
const val = id => dlgform.querySelector("#" + id)?.value?.trim() ?? "";

function taskDialog(t, preset = {}) {
  const n = now();
  const isNew = !t;
  t ||= { title: "", subject: S.subjects[0]?.name || "", sessions: 2, due: "", dueTime: "", pin: preset.at ? { date: n.today, from: preset.at } : null };
  openDialog(isNew ? "Новая задача" : "Задача", `
    <label class="field"><span>Что сделать</span><input type="text" id="f-title" required maxlength="100" value="${esc(t.title)}" placeholder="ДЗ по истории, доклад по биологии"></label>
    <div class="grid2"><label class="field"><span>Предмет</span><select id="f-subj">${subjOptions(t.subject)}</select></label>
      <label class="field"><span>Сколько сессий по ${S.sessionMin} мин</span><input type="number" id="f-sess" min="1" max="20" value="${t.sessions}"></label></div>
    <div class="grid2"><label class="field"><span>Срок (необязательно)</span><input type="date" id="f-due" value="${esc(t.due || "")}"></label>
      <label class="field"><span>До скольки</span><input type="time" id="f-duetime" value="${esc(t.dueTime || "")}"></label></div>
    <div class="field"><span>Сделать в конкретное время (необязательно)</span><div class="grid2"><input type="date" id="f-pindate" aria-label="День" value="${esc(t.pin?.date || "")}"><input type="time" id="f-pinfrom" aria-label="Начало" value="${esc(t.pin?.from || "")}"></div></div>
    ${!isNew ? `<div class="small muted">Сделано ${t.done} из ${t.sessions}</div>` : ""}`, {
    submit: () => {
      const title = val("f-title"); if (!title) return false;
      const sessions = Math.max(1, Math.min(20, parseInt(val("f-sess")) || 1));
      const pd = val("f-pindate"), pf = val("f-pinfrom");
      change(() => {
        const target = isNew ? { id: C.uid("t"), done: 0, created: n.today } : S.tasks.find(x => x.id === t.id);
        Object.assign(target, { title, subject: val("f-subj"), sessions: Math.max(sessions, target.done || 0), due: val("f-due") || null, dueTime: val("f-duetime") || null, kind: "other", pin: pd && pf ? { date: pd, from: pf } : null });
        if (isNew) S.tasks.push(target);
      });
    },
    actions: isNew ? {} : {
      skip: { label: "Не сегодня", run: () => change(() => { const x = S.tasks.find(y => y.id === t.id); (x.skip ||= []).push(n.today); if (x.pin?.date === n.today) x.pin = null; }) },
      done: { label: "Готово целиком", run: () => change(() => { const x = S.tasks.find(y => y.id === t.id); x.done = x.sessions; x.doneAt = n.today; }) },
      del: { label: "Удалить", cls: "danger", run: () => change(() => { S.tasks = S.tasks.filter(y => y.id !== t.id); }) },
    },
  });
}
function lessonDialog(l) {
  const isNew = !l;
  l ||= { title: "", subject: S.subjects[0]?.name || "", days: [], from: "", to: "" };
  openDialog(isNew ? "Новое занятие" : "Занятие", `
    <label class="field"><span>Название</span><input type="text" id="f-title" required maxlength="80" value="${esc(l.title)}" placeholder="Репетитор по истории"></label>
    <label class="field"><span>Предмет</span><select id="f-subj">${subjOptions(l.subject)}</select></label>
    <div class="field"><span>Дни</span><div class="days">${C.DAYS.map((d, i) => `<button type="button" class="daybtn" data-d="${i}" aria-pressed="${l.days.includes(i)}">${d}</button>`).join("")}</div></div>
    <div class="grid2"><label class="field"><span>Начало</span><input type="time" id="f-from" value="${esc(l.from)}"></label><label class="field"><span>Конец</span><input type="time" id="f-to" value="${esc(l.to)}"></label></div>`, {
    submit: () => {
      const title = val("f-title"); if (!title) return false;
      const days = [...dlgform.querySelectorAll(".daybtn[aria-pressed=true]")].map(b => +b.dataset.d);
      let from = val("f-from"), to = val("f-to");
      if (from && !to) to = C.toHHMM(Math.min(C.toMin(from) + 90, 1439));
      change(() => {
        const target = isNew ? { id: C.uid("l") } : S.lessons.find(x => x.id === l.id);
        Object.assign(target, { title, subject: val("f-subj"), days, from, to });
        if (isNew) S.lessons.push(target);
      });
    },
    actions: isNew ? {} : {
      cancelToday: { label: "Отменить сегодня", run: () => change(() => { const d = now().today; if (!S.cancelled.some(c => c.lessonId === l.id && c.date === d)) S.cancelled.push({ lessonId: l.id, date: d }); }) },
      del: { label: "Удалить совсем", cls: "danger", run: () => change(() => { S.lessons = S.lessons.filter(x => x.id !== l.id); }) },
    },
  });
}
function eventDialog(e) {
  const isNew = !e;
  e ||= { title: "", subject: S.subjects[0]?.name || "", date: now().today, from: "", to: "" };
  openDialog(isNew ? "Разовое событие" : "Событие", `
    <label class="field"><span>Что</span><input type="text" id="f-title" required maxlength="80" value="${esc(e.title)}" placeholder="Зачёт по обществу, кружок, поездка"></label>
    <div class="grid2"><label class="field"><span>Предмет</span><select id="f-subj">${subjOptions(e.subject)}</select></label><label class="field"><span>Дата</span><input type="date" id="f-date" required value="${esc(e.date)}"></label></div>
    <div class="grid2"><label class="field"><span>Начало</span><input type="time" id="f-from" required value="${esc(e.from)}"></label><label class="field"><span>Конец</span><input type="time" id="f-to" value="${esc(e.to)}"></label></div>`, {
    submit: () => {
      const title = val("f-title"), date = val("f-date"), from = val("f-from"); if (!title || !date || !from) return false;
      const to = val("f-to") || C.toHHMM(Math.min(C.toMin(from) + 60, 1439));
      change(() => {
        const target = isNew ? { id: C.uid("x") } : S.extraLessons.find(x => x.id === e.id);
        Object.assign(target, { title, subject: val("f-subj"), date, from, to });
        if (isNew) S.extraLessons.push(target);
      });
    },
    actions: isNew ? {} : { del: { label: "Удалить", cls: "danger", run: () => change(() => { S.extraLessons = S.extraLessons.filter(x => x.id !== e.id); }) } },
  });
}
function dayDialog(date) {
  const ov = S.avail[date] || {}, base = S.free[C.weekday(date)];
  openDialog(`${C.DAYS_FULL[C.weekday(date)]}, ${C.humanDate(date)}`, `
    <p class="small muted" style="margin:0">Обычно в этот день: ${base.off ? "выходной" : `${base.from}–${base.to}`}. Здесь можно поменять только этот день.</p>
    <label class="row"><input type="checkbox" id="f-off" ${ov.off ? "checked" : ""}> В этот день без подготовки</label>
    <div class="grid2"><label class="field"><span>Свободна с</span><input type="time" id="f-from" value="${esc(ov.from || base.from)}"></label><label class="field"><span>до</span><input type="time" id="f-to" value="${esc(ov.to || base.to)}"></label></div>`, {
    submit: () => change(() => {
      if (dlgform.querySelector("#f-off").checked) S.avail[date] = { off: true };
      else { const f = val("f-from"), t = val("f-to"); if (f === base.from && t === base.to && !base.off) delete S.avail[date]; else S.avail[date] = { from: f, to: t }; }
    }),
    actions: S.avail[date] ? { reset: { label: "Как обычно", run: () => change(() => { delete S.avail[date]; }) } } : {},
  });
}
function learnedDialog() {
  openDialog("Какую тему изучила?", `<p class="small muted" style="margin:0">Повторения сами появятся в плане через ${C.INTERVALS.join(", ")} дней.</p>
    <label class="field"><span>Тема</span><input type="text" id="f-title" required maxlength="80" placeholder="Реформы Петра I"></label>
    <label class="field"><span>Предмет</span><select id="f-subj">${subjOptions(S.subjects[0]?.name)}</select></label>`, {
    submitLabel: "Запомнить",
    submit: () => { const title = val("f-title"); if (!title) return false; const n = now();
      change(() => { C.addTopic(S, title, val("f-subj"), n.today); say("assistant", `Запомнила «${title}» 📚 Первое повторение завтра, потом через 3, 7, 14, 30 и 60 дней.`); }); },
  });
}

// ---------- действия ----------
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t || !S || t.closest("dialog")) return;
  const n = now(), d = t.dataset;
  if (d.view) { view = d.view; history.replaceState(null, "", "#" + view); render(); scrollTo(0, view === "chat" ? document.body.scrollHeight : 0); return; }
  if (d.start) { const [type, ref] = d.start.split("|"); const b = todayBlocks.find(x => x.type === type && String(x.ref) === ref) || { type, ref, title: (S.tasks.find(t => t.id === ref) || S.habits.find(h => h.id === ref) || S.topics.find(t => t.id === ref) || {}).title || "Задача", subject: "" }; if (session && session.phase === "work") { view = "session"; render(); return; } startSession(b); return; }
  if (d.dur) { const m = +d.dur; session = { ...session, len: m, left: m * 60000, endAt: session.endAt ? Date.now() + m * 60000 : null }; keepSession(); render(); return; }
  if (d.done !== undefined) { const b = todayBlocks[+d.done]; if (b) change(() => C.markDone(S, n.today, b)); return; }
  if (d.undo !== undefined) { change(() => C.undoDone(S, n.today, +d.undo)); return; }
  if (d.grade) { change(() => C.gradeReview(S, n.today, d.ref, d.grade, d.start ? +d.start : n.min)); return; }
  if (d.editTask) { taskDialog(S.tasks.find(x => x.id === d.editTask)); return; }
  if (d.editLesson) { const l = S.lessons.find(x => x.id === d.editLesson); if (l) lessonDialog(l); return; }
  if (d.editEvent) { const x = S.extraLessons.find(y => y.id === d.editEvent); if (x) eventDialog(x); return; }
  if (d.editDay) { dayDialog(d.editDay); return; }
  if (d.delTopic) { change(() => { S.topics = S.topics.filter(x => x.id !== d.delTopic); S.cards = S.cards.filter(c => c.topicId !== d.delTopic); }); return; }
  if (d.delCard) { change(() => { S.cards = S.cards.filter(c => c.id !== d.delCard); }); return; }
  if (d.addCards !== undefined) { addCardsDialog(d.addCards || null); return; }
  if (d.genCards) { genCards(d.genCards); return; }
  if (d.quizTopic) { startQuiz({ topicId: d.quizTopic, n: 5, mode: "topic" }); return; }
  switch (d.act) {
    case "new-task": taskDialog(null, { at: d.at }); return;
    case "new-lesson": lessonDialog(null); return;
    case "new-event": eventDialog(null); return;
    case "learned": learnedDialog(); return;
    case "tired": change(() => { S.tired[n.today] = { micro: 0 }; say("user", "Сил нет 🪫"); say("assistant", pick(ASK)); }); return;
    case "untired": change(() => { delete S.tired[n.today]; say("assistant", "Ура, силы вернулись! Показываю обычный план 💪"); }); return;
    case "quiz-any": startQuiz({ n: 5 }); return;
    case "session-back": view = "today"; history.replaceState(null, "", "#today"); render(); return;
    case "session-pause": if (!session) return; if (session.endAt) { session.left = leftMs(); session.endAt = null; } else session.endAt = Date.now() + session.left; keepSession(); render(); return;
    case "session-done": finishPhase(true); return;
    case "session-cancel": session = null; keepSession(); view = "today"; history.replaceState(null, "", "#today"); document.title = "Мой план ЕГЭ"; render(); return;
    case "quiz-skip": { const q = quiz, c = q.cards[q.i]; q.results.push(false); C.recordAnswer(S, c.id, false, n.today); q.log.push({ role: "user", text: "Не помню" }, { role: "assistant", text: `Ничего! Правильно: ${c.a}` }); q.fb = { ok: false, text: `Ничего! Правильно: ${c.a}` }; q.phase = "result"; render(); save(); return; }
    case "quiz-self-yes": quizSelf(true); return;
    case "quiz-self-no": quizSelf(false); return;
    case "quiz-next": quizNext(); return;
    case "quiz-stop": finishQuiz(); return;
    case "micro-yes": {
      const o = C.microOptions(S, n.today)[0]; if (!o) return;
      if (o.kind === "quiz") { change(() => say("user", "Ну так и быть")); tiredRef = o.ref; startQuiz({ n: 3, mode: "tired", topicId: o.topicId || null, subject: o.topicId ? null : (o.subject || null) }); return; }
      change(() => {
        if (o.kind === "review") C.gradeReview(S, n.today, o.ref, "hard", n.min);
        else (S.log[n.today] ||= []).push({ kind: "micro", ref: o.ref, title: o.title, subject: o.subject, start: n.hhmm, end: C.toHHMM(Math.min(n.min + 5, 1439)) });
        S.tired[n.today].micro = (S.tired[n.today].micro || 0) + 1;
        say("user", "Сделала ✓"); say("assistant", pick(PRAISE));
      }); return;
    }
    case "micro-no": change(() => { S.tired[n.today].rest = true; say("user", S.tired[n.today].micro ? "Всё, отдыхаю" : "Не сегодня"); say("assistant", "Отдыхай 🫶 Всё несделанное я перенесла на ближайшие дни, ничего не потеряется."); }); return;
    case "lighten": change(() => { S.capFactor = 0.75; (S.lightenAsked ||= {})[n.today] = true; say("assistant", "Готово: облегчила план на четверть. Если станет легче — верну обычную нагрузку в разделе «Расписание»."); }); return;
    case "nolighten": change(() => { (S.lightenAsked ||= {})[n.today] = true; }); return;
    case "unlighten": change(() => { S.capFactor = 1; }); return;
  }
});
document.addEventListener("toggle", e => { const el = e.target; if (el.matches?.("details[data-topic]")) { if (el.open) openTopics.add(el.dataset.topic); else openTopics.delete(el.dataset.topic); } }, true);
document.addEventListener("change", e => {
  if (!S) return;
  const el = e.target, d = el.dataset;
  if (d.free !== undefined) { change(() => { const f = S.free[+d.free]; if (d.k === "off") f.off = el.checked; else f[d.k] = el.value; }); return; }
  if (d.set) { change(() => { S[d.set] = +el.value; }); return; }
  if (el.id === "set-habit") { change(() => { S.habits = el.checked ? [{ id: C.uid("h"), title: "Школьные задания", subject: "Школа", days: [0, 1, 2, 3, 4], sessions: 1 }] : []; }); }
});
document.addEventListener("submit", async e => {
  if (!S || e.target.closest("dialog")) return;
  e.preventDefault();
  const n = now();
  if (e.target.id === "topicform") {
    const titles = $("#topic-titles").value.split("\n").map(s => s.trim()).filter(Boolean).slice(0, 30);
    if (!titles.length) return;
    const subj = $("#topic-subj").value;
    change(() => { titles.forEach(t => C.addTopic(S, t, subj, n.today)); say("assistant", `Добавила ${titles.length} ${word(titles.length, "тему", "темы", "тем")} на повторение 📚 Первое — завтра.`); });
    return;
  }
  if (e.target.matches("[data-quiz]")) {
    const input = e.target.querySelector("input"); const text = input.value.trim(); if (!text || !quiz || quiz.phase !== "ask") return;
    answerQuiz(text); return;
  }
  if (e.target.matches("[data-composer]")) {
    const input = e.target.querySelector("input");
    const msg = input.value.trim(); if (!msg || thinking) return;
    const before = planKeys(C.buildPlan(S, n.today, 7, n.min));
    thinking = true; input.value = "";
    S.chat.push({ role: "user", text: msg, at: Date.now(), pending: true });
    render();
    try {
      if (saving || savePending) await new Promise(r => setTimeout(r, 700));
      const r = await fetch("/api/assistant", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ u: U, message: msg, today: n.today, now: n.hhmm }) });
      const j = await r.json();
      thinking = false;
      if (!r.ok) { S.chat = S.chat.filter(m => !m.pending); S.chat.push({ role: "assistant", text: j.error || "Помощник не ответил. Попробуй ещё раз.", at: Date.now() }); input.value = msg; render(); return; }
      S = j.state; S.cards ||= [];
      if (j.quiz) setTimeout(() => startQuiz({ subject: j.quiz.subject, topicTitle: j.quiz.topic, n: j.quiz.n || 5 }), 300);
      const after = planKeys(C.buildPlan(S, n.today, 7, n.min));
      highlight = new Set([...after].filter(k => !before.has(k)));
      render();
      setTimeout(() => { highlight = new Set(); render(); }, 4000);
    } catch {
      thinking = false; S.chat = S.chat.filter(m => !m.pending);
      S.chat.push({ role: "assistant", text: "Нет связи. Проверь интернет и отправь ещё раз — текст я вернула в поле.", at: Date.now() });
      input.value = msg; render();
    }
    (matchMedia("(min-width:1000px)").matches ? $("#msg-desk") : $("#msg-m"))?.focus();
  }
});
function planKeys(plan) { const k = new Set(); for (const d of plan) for (const b of d.blocks) if (b.type !== "done") k.add(`${d.date}|${b.type}|${b.ref}|${b.start}`); return k; }
addEventListener("hashchange", () => { const v = location.hash.slice(1); if (VIEWS.some(x => x[0] === v) || v === "session" || v === "day") { view = v; if (S) render(); } });
setInterval(() => { if (S && !quiz && !document.hidden && !dlg.open && !["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName)) render(); }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && S && !thinking && !quiz && !dlg.open) load(); });
load();
</script>
